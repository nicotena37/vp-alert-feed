name: Sanzioni da fonti ufficiali

on:
  workflow_dispatch:
  push:
    paths: ["sanzioni_avvia.txt"]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: write

jobs:
  sanzioni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml==5.3.0 beautifulsoup4==4.12.3
      - run: python sanzioni.py
      - name: Salvataggio
        run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add archivio/sanzioni
          git diff --cached --quiet && exit 0
          git commit -m "Sanzioni $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((10 * i))
          done
          exit 1
