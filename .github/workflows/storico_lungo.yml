name: Storico lungo per le previsioni

on:
  workflow_dispatch:
    inputs:
      fonti:
        description: 'Fonti da scaricare, in JSON (es. ["camera"])'
        default: '["eurlex","bce","senato","camera","mediacloud","openalex"]'
  push:
    paths: ["storico_avvia.txt"]

permissions:
  contents: write

jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        fonte: ${{ fromJSON(github.event.inputs.fonti || '["eurlex","bce","senato","camera","mediacloud","openalex"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml==5.3.0 beautifulsoup4==4.12.3 mediacloud
      - name: Scarico ${{ matrix.fonte }}
        timeout-minutes: 320
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python storico_lungo.py --dal 2016-01 --solo ${{ matrix.fonte }}
      - name: Salvataggio
        if: always()
        run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add archivio/storico
          git diff --cached --quiet && exit 0
          git commit -m "Storico lungo ${{ matrix.fonte }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase --quiet && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((10 * i))
          done
          exit 1
