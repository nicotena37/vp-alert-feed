name: Catalogo legal inventory

on:
  workflow_dispatch:
  push:
    paths: ["catalogo/avvia.txt"]

permissions:
  contents: write

concurrency:
  group: leggi-feed
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests==2.32.3 lxml==5.3.0 beautifulsoup4==4.12.3
      - run: python catalogo.py
      - run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add dati/catalogo biblioteca
          git diff --cached --quiet || git commit -m "Catalogo $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
