name: Biblioteca completa

on:
  workflow_dispatch:
  push:
    paths: ["biblioteca/avvia.txt"]

permissions:
  contents: write
  actions: write

concurrency:
  group: biblioteca
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        blocco: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests==2.32.3
      - run: python biblioteca_tutto.py ${{ matrix.blocco }} 4 100
      - run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add biblioteca
          git diff --cached --quiet || git commit -q -m "Biblioteca blocco ${{ matrix.blocco }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push --quiet && break
            sleep $((RANDOM % 20 + 5))
          done

  continua:
    needs: scarica
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --quiet || true
          giro=$(cat biblioteca/giri.txt 2>/dev/null || echo 0); giro=$((giro+1))
          resto=0
          for k in 0 1 2 3; do m=$(grep "^BLOCCO $k" biblioteca/log_blocco$k.txt 2>/dev/null | tail -1 | sed -n 's/.*mancano \([0-9]*\).*/\1/p'); resto=$((resto+${m:-1})); done
          echo "giro $giro, mancano $resto"
          if [ "$resto" -gt 0 ] && [ "$giro" -lt 15 ]; then
            echo $giro > biblioteca/giri.txt
            git config user.name "vp-alert-feed"; git config user.email "vp-alert-feed@users.noreply.github.com"
            git add biblioteca/giri.txt; git commit -q -m "Biblioteca: giro $giro" && git push --quiet || true
            gh workflow run biblioteca.yml --ref main
          fi
