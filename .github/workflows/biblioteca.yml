name: Biblioteca completa

on:
  workflow_dispatch:
  push:
    paths: ["biblioteca/avvia.txt"]

permissions:
  contents: write

concurrency:
  group: biblioteca
  cancel-in-progress: false

jobs:
  scarica:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        blocco: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests==2.32.3
      - run: python biblioteca_tutto.py ${{ matrix.blocco }} 4 100
      - run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add biblioteca
          git diff --cached --quiet || git commit -q -m "Biblioteca blocco ${{ matrix.blocco }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push --quiet && break
            sleep $((RANDOM % 20 + 5))
          done
