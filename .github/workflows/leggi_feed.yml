name: Leggi feed VP Alert

on:
  workflow_dispatch:            # avvio a mano dalla scheda Actions (pulsante "Run workflow")
  push:
    paths: ["avvia.txt"]        # avvio da Claude: modifica di avvia.txt
  schedule:
    - cron: "17 4 * * 1-5"      # ogni giorno feriale alle 04:17 UTC (06:17 ora italiana)

permissions:
  contents: write

concurrency:
  group: leggi-feed
  cancel-in-progress: false

jobs:
  leggi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml==5.3.0 beautifulsoup4==4.12.3
      - name: Lettura dei feed
        run: python leggi_feed.py
      - name: Salvataggio dei risultati nell'archivio
        run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add dati
          git diff --cached --quiet || git commit -m "Feed letti il $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
