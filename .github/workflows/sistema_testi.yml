name: Biblioteca sistema testi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  estendi:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet requests==2.32.3
      - run: python biblioteca_estendi.py 85
      - run: |
          git config user.name "vp-alert-feed"; git config user.email "vp-alert-feed@users.noreply.github.com"
          git add biblioteca; git diff --cached --quiet || git commit -q -m "Biblioteca: atti italiani completati $(date -u +%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --quiet && git push --quiet && break; sleep $((RANDOM % 20 + 5)); done
  lingua:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      TESSDATA: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ita >/dev/null
      - run: pip install --quiet requests==2.32.3 lxml==5.3.0 beautifulsoup4==4.12.3
      - run: python autorita.py rifai biblioteca/lettura/testi_cirillico.json 80
      - run: |
          git config user.name "vp-alert-feed"; git config user.email "vp-alert-feed@users.noreply.github.com"
          git add biblioteca; git diff --cached --quiet || git commit -q -m "Biblioteca: testi EBA/EIOPA riscaricati in italiano o inglese $(date -u +%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --quiet && git push --quiet && break; sleep $((RANDOM % 20 + 5)); done
