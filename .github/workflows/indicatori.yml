name: Indicatori temi attuali

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      storico:
        description: "Settimane da ricostruire all'indietro (0 = giro normale)"
        default: "0"
  push:
    paths: ["indicatori_avvia.txt"]

permissions:
  contents: write

concurrency:
  group: leggi-feed
  cancel-in-progress: false

jobs:
  indicatori:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet lxml==5.3.0 beautifulsoup4==4.12.3 mediacloud
      - name: Raccogli indicatori
        env:
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
        run: |
          N="${{ github.event.inputs.storico }}"
          if [ -z "$N" ] && [ -f indicatori_avvia.txt ]; then N=$(grep -oE '^[0-9]+' indicatori_avvia.txt | head -1); fi
          python indicatori.py --storico "${N:-0}"
      - run: |
          git config user.name "vp-alert-feed"
          git config user.email "vp-alert-feed@users.noreply.github.com"
          git add archivio
          git diff --cached --quiet || git commit -m "Indicatori $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
